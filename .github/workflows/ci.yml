name: CI

# The application is Windows-only, so everything runs on a Windows runner.
#
# Two jobs, deliberately:
#   checks  lint plus the 529 tests that need no windowing system.  This is the
#           job that must stay green.
#   gui     the 91 Qt widget tests.  They create real windows; the first run on
#           windows-latest showed the runner can do that, so this job is
#           required too.  If a future runner image cannot, the honest fix is
#           to say so here rather than to stop running them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Tests (no windowing system required)
        run: python -m pytest -m "not gui"

  gui:
    name: Qt widget tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests (Qt widgets)
        run: python -m pytest -m gui

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400"
     width="100%" role="img" font-family="Sarabun, 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39b3c9"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9e77"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2733"
                    flood-opacity="0.13"/>
    </filter>

  </defs>
<rect x="0" y="0" width="960" height="400" fill="none"/>
<rect x="24" y="20" width="448" height="360" rx="14" fill="#e4f3ec" stroke="#1f7a4d" stroke-width="1.5" filter="url(#soft)"/>
<circle cx="64" cy="62" r="20" fill="#1f7a4d"/><path d="M55 62 l6 7 l12 -15" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="96" y="70" font-size="19" fill="#1f7a4d" font-weight="700" text-anchor="start">รองรับ</text>
<circle cx="60" cy="107" r="5" fill="#1f7a4d"/>
<text x="78" y="112" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ PDF ที่มีชั้นข้อความ</text>
<circle cx="60" cy="140" r="5" fill="#1f7a4d"/>
<text x="78" y="145" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ Word (.docx)</text>
<circle cx="60" cy="173" r="5" fill="#1f7a4d"/>
<text x="78" y="178" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ Excel (.xlsx)</text>
<circle cx="60" cy="206" r="5" fill="#1f7a4d"/>
<text x="78" y="211" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ข้อความ (.txt)</text>
<circle cx="60" cy="239" r="5" fill="#1f7a4d"/>
<text x="78" y="244" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">เลือกเพิ่มได้: .md .csv .log</text>
<circle cx="60" cy="272" r="5" fill="#1f7a4d"/>
<text x="78" y="277" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ค้นหาทั้งชื่อไฟล์และเนื้อหา</text>
<circle cx="60" cy="305" r="5" fill="#1f7a4d"/>
<text x="78" y="310" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ภาษาไทยและภาษาอังกฤษ</text>
<circle cx="60" cy="338" r="5" fill="#1f7a4d"/>
<text x="78" y="343" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไดรฟ์และโฟลเดอร์ภายในเครื่อง</text>
<rect x="488" y="20" width="448" height="360" rx="14" fill="#fdece3" stroke="#d9480f" stroke-width="1.5" filter="url(#soft)"/>
<circle cx="528" cy="62" r="20" fill="#d9480f"/><g stroke="#ffffff" stroke-width="4" stroke-linecap="round"><line x1="521" y1="55" x2="535" y2="69"/><line x1="535" y1="55" x2="521" y2="69"/></g>
<text x="560" y="70" font-size="19" fill="#d9480f" font-weight="700" text-anchor="start">ไม่รองรับในเวอร์ชัน 1</text>
<circle cx="524" cy="107" r="5" fill="#d9480f"/>
<text x="542" y="112" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">PDF ที่เป็นภาพสแกน (ไม่มี OCR)</text>
<circle cx="524" cy="140" r="5" fill="#d9480f"/>
<text x="542" y="145" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ .doc และ .xls รูปแบบเก่า</text>
<circle cx="524" cy="173" r="5" fill="#d9480f"/>
<text x="542" y="178" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไฟล์ที่มีรหัสผ่านป้องกัน</text>
<circle cx="524" cy="206" r="5" fill="#d9480f"/>
<text x="542" y="211" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ไดรฟ์เครือข่าย NAS และ UNC</text>
<circle cx="524" cy="239" r="5" fill="#d9480f"/>
<text x="542" y="244" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">คลาวด์ เช่น OneDrive ที่ยังไม่ดาวน์โหลด</text>
<circle cx="524" cy="272" r="5" fill="#d9480f"/>
<text x="542" y="277" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">ค้นหาด้วย AI หรือถาม-ตอบ</text>
<circle cx="524" cy="305" r="5" fill="#d9480f"/>
<text x="542" y="310" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">คำนวณสูตรใน Excel ใหม่</text>
<circle cx="524" cy="338" r="5" fill="#d9480f"/>
<text x="542" y="343" font-size="15" fill="#1b2733" font-weight="400" text-anchor="start">เลขหน้าที่แน่นอนของไฟล์ Word</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400"
     width="100%" role="img" font-family="Sarabun, 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39b3c9"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9e77"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2733"
                    flood-opacity="0.13"/>
    </filter>
    <linearGradient id="solidBlue" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5ec3d8"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="solidGreen" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#57c69a"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="solidAmber" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#e0a500"/>
    </linearGradient>
    <linearGradient id="solidViolet" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#8f7ccc"/>
      <stop offset="1" stop-color="#5f4b9b"/>
    </linearGradient>
    <linearGradient id="solidCoral" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#f08a5d"/>
      <stop offset="1" stop-color="#d9480f"/>
    </linearGradient>
    <radialGradient id="glossy" cx="0.32" cy="0.26" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1b2733"
                    flood-opacity="0.18"/>
    </filter>
  </defs>
<rect x="0" y="0" width="1000" height="400" fill="none"/>
<rect x="24" y="26" width="580" height="348" rx="16" fill="#ffffff" stroke="#d9dfe5" stroke-width="1.6" filter="url(#lift)"/>
<path d="M24 74 v-32 a16 16 0 0 1 16 -16 h548 a16 16 0 0 1 16 16 v32 z" fill="#eef2f6"/>
<circle cx="48" cy="50" r="6" fill="#f2725c"/>
<circle cx="68" cy="50" r="6" fill="#f3c14a"/>
<circle cx="88" cy="50" r="6" fill="#5cc48a"/>
<text x="126" y="55" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">dist  ›  Advance File Search</text>
<rect x="40" y="76" width="548" height="46" rx="10" fill="#e3eef3" stroke="#1d6f8b" stroke-width="1.4"/>
<g filter="url(#lift)"><circle cx="70" cy="98" r="16" fill="url(#solidBlue)"/><circle cx="70" cy="98" r="16" fill="url(#glossy)"/></g>
<g>
    <circle cx="66" cy="94" r="7" fill="#ffffff" opacity="0.9"/>
    <circle cx="66" cy="94" r="7" fill="none" stroke="#ffffff"

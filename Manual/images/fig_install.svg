<text x="112" y="101" font-size="14" fill="#1d6f8b" font-weight="700" text-anchor="start">AdvanceFileSearch.exe</text>
<text x="330" y="101" font-size="12.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ไฟล์สำหรับเปิดโปรแกรม</text>
<path d="M56 128 h20 l6 7 h22 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-48 a5 5 0 0 1 -5 -5 v-25 a5 5 0 0 1 5 -5 z" fill="#fff3cd" stroke="#f2b705" stroke-width="1.6"/>
<text x="112" y="147" font-size="14" fill="#1b2733" font-weight="400" text-anchor="start">_internal</text>
<text x="330" y="147" font-size="12.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ส่วนประกอบภายใน ห้ามลบ</text>
<path d="M56 174 h20 l6 7 h22 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-48 a5 5 0 0 1 -5 -5 v-25 a5 5 0 0 1 5 -5 z" fill="#fff3cd" stroke="#f2b705" stroke-width="1.6"/>
<text x="112" y="193" font-size="14" fill="#1b2733" font-weight="400" text-anchor="start">LICENSES</text>
<text x="330" y="193" font-size="12.5" fill="#5a6b7b" font-weight="400" text-anchor="start">สัญญาอนุญาตของซอฟต์แวร์ที่ใช้</text>
<path d="M56 220 h20 l6 7 h22 a5 5 0 0 1 5 5 v18 a5 5 0 0 1 -5 5 h-48 a5 5 0 0 1 -5 -5 v-25 a5 5 0 0 1 5 -5 z" fill="#fff3cd" stroke="#f2b705" stroke-width="1.6"/>
<text x="112" y="239" font-size="14" fill="#1b2733" font-weight="400" text-anchor="start">Manual</text>
<text x="330" y="239" font-size="12.5" fill="#5a6b7b" font-weight="400" text-anchor="start">คู่มือการใช้งานและรายงานโครงการ</text>
<g transform="translate(58,264)">
    <path d="M0 6 a6 6 0 0 1 6 -6 h7.199999999999999 l7.199999999999999 7.199999999999999

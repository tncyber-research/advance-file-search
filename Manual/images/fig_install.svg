<text x="112" y="331" font-size="14" fill="#1b2733" font-weight="400" text-anchor="start">PRIVACY.txt</text>
<text x="330" y="331" font-size="12.5" fill="#5a6b7b" font-weight="400" text-anchor="start">คำแถลงความเป็นส่วนตัว</text>
<g filter="url(#lift)"><rect x="635" y="47" width="344" height="96" rx="18" fill="#1d6f8b" opacity="0.25"/><rect x="632" y="40" width="344" height="96" rx="18" fill="url(#solidBlue)"/><rect x="632" y="40" width="344" height="96" rx="18" fill="url(#glossy)"/></g>
<circle cx="678" cy="88" r="24" fill="#ffffff" opacity="0.22"/>
<text x="678" y="96" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="716" y="82" font-size="15" fill="#ffffff" font-weight="700" text-anchor="start">คัดลอกทั้งโฟลเดอร์</text>
<text x="716" y="108" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">วางไว้ที่ใดก็ได้ในเครื่อง เช่น ไดรฟ์ D</text>
<g filter="url(#lift)"><rect x="635" y="163" width="344" height="96" rx="18" fill="#5f4b9b" opacity="0.25"/><rect x="632" y="156" width="344" height="96" rx="18" fill="url(#solidViolet)"/><rect x="632" y="156" width="344" height="96" rx="18" fill="url(#glossy)"/></g>
<circle cx="678" cy="204" r="24" fill="#ffffff" opacity="0.22"/>
<text x="678" y="212" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="716" y="198" font-size="15" fill="#ffffff" font-weight="700" text-anchor="start">ดับเบิลคลิกที่ไฟล์ .exe</text>
<text x="716" y="224" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">ไม่ต้องติดตั้ง ไม่ต้องใช้สิทธิ์ผู้ดูแลระบบ</text>
<g filter="url(#lift)"><rect x="635" y="279" width="344" height="96" rx="18" fill="#1f7a4d" opacity="0.25"/><rect x="632" y="272" width="344" height="96" rx="18" fill="url(#solidGreen)"/><rect x="632" y="272" width="344" height="96" rx="18" fill="url(#glossy)"/></g>
<circle cx="678" cy="320" r="24" fill="#ffffff" opacity="0.22"/>
<text x="678" y="328" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="716" y="314" font-size="15" fill="#ffffff" font-weight="700" text-anchor="start">เริ่มใช้งานได้ทันที</text>
<text x="716" y="340" font-size="12.5" fill="#ffffff" font-weight="400" text-anchor="start">ไม่ต้องเชื่อมต่ออินเทอร์เน็ต</text>
</svg>

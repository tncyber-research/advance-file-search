<text x="376" y="168" font-size="13" fill="#1f7a4d" font-weight="700" text-anchor="start">ตัวอ่านเอกสาร</text>
<text x="372" y="196" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">PDF · DOCX · XLSX · TXT</text>
<text x="372" y="220" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">สัญญาผลลัพธ์ร่วมกัน</text>
<text x="372" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">รับมือไฟล์เสียและล็อก</text>
<circle cx="602" cy="96" r="26" fill="#f2b705" stroke="#ffffff" stroke-width="4"/>

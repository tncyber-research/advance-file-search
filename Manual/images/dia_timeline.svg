    <marker id="ar_violet" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#5f4b9b"/>
    </marker>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39b3c9"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2733"
                    flood-opacity="0.13"/>
    </filter>

  </defs>
<rect x="0" y="0" width="1040" height="470" fill="none"/>
<line x1="60" y1="96" x2="980" y2="96" stroke="#d9dfe5" stroke-width="4"/>
<circle cx="98" cy="96" r="26" fill="#1d6f8b" stroke="#ffffff" stroke-width="4"/>
<text x="98" y="103" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="20" y="142" width="156" height="150" rx="12" fill="#ffffff" stroke="#1d6f8b" stroke-width="1.6" filter="url(#soft)"/>
<rect x="20" y="142" width="7" height="150" rx="3.5" fill="#1d6f8b"/>
<text x="40" y="168" font-size="13" fill="#1d6f8b" font-weight="700" text-anchor="start">วางแผนและตัดสินใจ</text>
<text x="36" y="196" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">อ่านข้อกำหนดทั้งหมด</text>
<text x="36" y="220" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ทดลองเรื่องภาษาไทยก่อน</text>
<text x="36" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">บันทึกเป็นเอกสาร ADR</text>
<circle cx="266" cy="96" r="26" fill="#5f4b9b" stroke="#ffffff" stroke-width="4"/>
<text x="266" y="103" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="188" y="142" width="156" height="150" rx="12" fill="#ffffff" stroke="#5f4b9b" stroke-width="1.6" filter="url(#soft)"/>
<rect x="188" y="142" width="7" height="150" rx="3.5" fill="#5f4b9b"/>
<text x="208" y="168" font-size="13" fill="#5f4b9b" font-weight="700" text-anchor="start">แกนกลางและข้อมูล</text>
<text x="204" y="196" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">สคีมาและชั้นข้อมูล</text>

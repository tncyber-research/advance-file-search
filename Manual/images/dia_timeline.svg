<text x="544" y="168" font-size="13" fill="#f2b705" font-weight="700" text-anchor="start">การค้นหา</text>
<text x="540" y="196" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">แปลคำค้น · wildcard</text>

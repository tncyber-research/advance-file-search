<text x="540" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ทางเลือกสำหรับคำสั้น</text>
<circle cx="770" cy="96" r="26" fill="#d9480f" stroke="#ffffff" stroke-width="4"/>

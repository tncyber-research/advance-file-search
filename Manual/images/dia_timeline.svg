<text x="204" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">บันทึกที่ไม่เก็บเนื้อหา</text>
<circle cx="434" cy="96" r="26" fill="#1f7a4d" stroke="#ffffff" stroke-width="4"/>

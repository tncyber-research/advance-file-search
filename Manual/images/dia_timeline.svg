<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470"
     width="100%" role="img" font-family="Sarabun, 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar_accent" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#1d6f8b"/>
    </marker>
    <marker id="ar_muted" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#5a6b7b"/>
    </marker>
    <marker id="ar_green" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#1f7a4d"/>
    </marker>
    <marker id="ar_amber" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#f2b705"/>
    </marker>
    <marker id="ar_coral" markerWidth="9" markerHeight="9" refX="7.5"

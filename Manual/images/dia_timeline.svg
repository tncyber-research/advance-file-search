<text x="708" y="220" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">งานเบื้องหลังกันจอค้าง</text>
<text x="708" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">สองภาษาเต็มรูปแบบ</text>
<circle cx="938" cy="96" r="26" fill="#41566b" stroke="#ffffff" stroke-width="4"/>
<text x="938" y="103" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<rect x="860" y="142" width="156" height="150" rx="12" fill="#ffffff" stroke="#41566b" stroke-width="1.6" filter="url(#soft)"/>
<rect x="860" y="142" width="7" height="150" rx="3.5" fill="#41566b"/>
<text x="880" y="168" font-size="13" fill="#41566b" font-weight="700" text-anchor="start">ทดสอบและแพ็กเกจ</text>
<text x="876" y="196" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ชุดทดสอบอัตโนมัติ</text>
<text x="876" y="220" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">ตรวจความปลอดภัย</text>
<text x="876" y="244" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">สร้าง .exe แล้วตรวจซ้ำ</text>
<rect x="24" y="320" width="992" height="126" rx="12" fill="#ffffff" stroke="#1d6f8b" stroke-width="1.6" filter="url(#soft)"/>
<rect x="24" y="320" width="7" height="126" rx="3.5" fill="#1d6f8b"/>
<text x="44" y="346" font-size="15" fill="#1d6f8b" font-weight="700" text-anchor="start">หลักที่ยึดตลอดทั้งโครงการ</text>
<text x="44" y="370" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ตัดสินใจเรื่องยากก่อน: เรื่องภาษาไทยถูกพิสูจน์ด้วยการทดลองจริงก่อนเขียนโปรแกรมจริง</text>
<text x="44" y="390" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">เขียนการทดสอบไปพร้อมกับโค้ด ไม่ใช่ทิ้งไว้ท้ายสุด</text>
<text x="44" y="410" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ทุกการตัดสินใจที่มีข้อแลกเปลี่ยน ถูกบันทึกไว้เป็นเอกสาร ADR พร้อมเหตุผล</text>
<text x="44" y="430" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ความเป็นส่วนตัวเป็นข้อกำหนดที่ทดสอบได้ ไม่ใช่คำสัญญาในเอกสาร</text>
</svg>

<text x="674" y="82" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">PK</text>
<text x="386" y="102" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">root_id</text>
<text x="674" y="102" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FK → roots</text>
<text x="386" y="122" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">display_path</text>
<text x="674" y="122" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT</text>
<text x="386" y="142" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">relative_path / file_name</text>

<text x="1062" y="312" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FTS5 external content</text>
<text x="782" y="332" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">content=</text>
<text x="1062" y="332" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">content_units</text>
<text x="782" y="352" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">tokenize=</text>
<text x="1062" y="352" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">trigram</text>
<text x="782" y="370" font-size="11.5" fill="#f2b705" font-weight="400" text-anchor="start">ทำให้ค้นคำกลางข้อความไทยได้</text>

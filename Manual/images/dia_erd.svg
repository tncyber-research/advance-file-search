<text x="278" y="312" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">PK</text>
<text x="38" y="332" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">root_id</text>
<text x="278" y="332" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FK → roots</text>
<text x="38" y="352" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">started_at / finished_at</text>
<text x="278" y="352" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT</text>
<text x="38" y="372" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">mode</text>
<text x="278" y="372" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">update / rebuild</text>
<text x="38" y="392" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">files_indexed</text>
<text x="278" y="392" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">INTEGER</text>
<text x="38" y="412" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">files_unchanged</text>
<text x="278" y="412" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">INTEGER</text>

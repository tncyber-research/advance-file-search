<path d="M24 560 v-28 a12 12 0 0 1 12 -12 h244 a12 12 0 0 1 12 12 v28 z" fill="#5a6b7b"/>
<text x="38" y="547" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="start">app_meta — ข้อมูลของฐานข้อมูลเอง</text>
<text x="38" y="582" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">key</text>
<text x="278" y="582" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">PK</text>
<text x="38" y="602" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">value</text>
<text x="278" y="602" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT</text>
<text x="38" y="620" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="start">เก็บเลขเวอร์ชันของสคีมา</text>
<rect x="372" y="20" width="316" height="310" rx="12" fill="#ffffff" stroke="#5f4b9b" stroke-width="1.8" filter="url(#soft)"/>

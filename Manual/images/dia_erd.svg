<text x="782" y="122" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">file_name</text>
<text x="1062" y="122" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FTS5 external content</text>
<text x="782" y="142" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">relative_path</text>
<text x="1062" y="142" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FTS5</text>
<text x="782" y="162" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">content=</text>
<text x="1062" y="162" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">files</text>
<text x="782" y="182" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">tokenize=</text>
<text x="1062" y="182" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">trigram</text>
<text x="782" y="200" font-size="11.5" fill="#f2b705" font-weight="400" text-anchor="start">ค้นเฉพาะชื่อไฟล์ได้โดยไม่แตะเนื้อหา</text>
<rect x="768" y="470" width="308" height="160" rx="12" fill="#ffffff" stroke="#d9480f" stroke-width="1.6" filter="url(#soft)"/>
<rect x="768" y="470" width="7" height="160" rx="3.5" fill="#d9480f"/>
<text x="788" y="496" font-size="15" fill="#d9480f" font-weight="700" text-anchor="start">ทริกเกอร์ 6 ตัว</text>
<text x="788" y="520" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">AFTER INSERT / DELETE / UPDATE</text>
<text x="788" y="540" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ของทั้ง files และ content_units</text>
<text x="788" y="560" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">อัปเดตดัชนี FTS ให้ตรงเสมอ</text>
<text x="788" y="580" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">โปรแกรมจึงไม่ต้องจำว่าต้องซิงก์เอง</text>
<text x="788" y="600" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ลดโอกาสที่ดัชนีจะเพี้ยน</text>
<path d="M292 90 L368 90" fill="none" stroke="#1d6f8b" stroke-width="2.4" marker-end="url(#ar_accent)"/>
<text x="330" y="80" font-size="12" fill="#1d6f8b" font-weight="400" text-anchor="middle">1 : N</text>
<path d="M292 300 L368 190" fill="none" stroke="#41566b" stroke-width="2.4" marker-end="url(#ar_muted)"/>
<path d="M530 300 L530 376" fill="none" stroke="#5f4b9b" stroke-width="2.4" marker-end="url(#ar_violet)"/>
<text x="576" y="344" font-size="12" fill="#5f4b9b" font-weight="400" text-anchor="middle">1 : N</text>
<path d="M692 440 L764 360" fill="none" stroke="#f2b705" stroke-width="2.4" marker-end="url(#ar_amber)"/>
<text x="700" y="232" font-size="12" fill="#f2b705" font-weight="400" text-anchor="start">ซิงก์ด้วยทริกเกอร์อัตโนมัติ</text>
<path d="M692 160 L764 140" fill="none" stroke="#f2b705" stroke-width="2.4" marker-end="url(#ar_amber)"/>
<text x="460" y="742" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="middle">หลักการเดียวกันทั้งฐานข้อมูล: ข้อความเก็บครั้งเดียว ดัชนีชี้กลับมาที่ข้อความนั้น และทุกคำสั่ง SQL ใช้พารามิเตอร์เสมอ</text>

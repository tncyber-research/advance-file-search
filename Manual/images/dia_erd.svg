<text x="674" y="162" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ใช้ค้นแบบไม่สนตัวพิมพ์</text>
<text x="386" y="182" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">extension · size_bytes</text>
<text x="674" y="182" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT · INT</text>
<text x="386" y="202" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">created_time · modified_time</text>
<text x="674" y="202" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">REAL</text>
<text x="386" y="222" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">fingerprint</text>
<text x="674" y="222" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ใช้ตรวจว่าไฟล์เปลี่ยนหรือยัง</text>

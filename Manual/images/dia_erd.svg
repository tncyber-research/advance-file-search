<text x="674" y="282" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT</text>
<text x="386" y="302" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">error_message_sanitized</text>
<text x="674" y="302" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ข้อความที่ล้างข้อมูลแล้ว</text>
<text x="386" y="320" font-size="11.5" fill="#5f4b9b" font-weight="400" text-anchor="start">UNIQUE (root_id, normalized_path) + ดัชนีช่วยค้น 6 ตัว</text>
<rect x="372" y="380" width="316" height="210" rx="12" fill="#ffffff" stroke="#1f7a4d" stroke-width="1.8" filter="url(#soft)"/>
<path d="M372 420 v-28 a12 12 0 0 1 12 -12 h292 a12 12 0 0 1 12 12 v28 z" fill="#1f7a4d"/>
<text x="386" y="407" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="start">content_units — หน่วยข้อความ</text>
<text x="386" y="442" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">id</text>
<text x="674" y="442" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">PK</text>
<text x="386" y="462" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">file_id</text>
<text x="674" y="462" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">FK → files</text>
<text x="386" y="482" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">sequence</text>
<text x="674" y="482" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ลำดับในไฟล์</text>
<text x="386" y="502" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">location_type</text>
<text x="674" y="502" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">page / paragraph / cell / line</text>
<text x="386" y="522" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">location_label</text>
<text x="674" y="522" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ข้อความที่แสดงให้ผู้ใช้</text>
<text x="386" y="542" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">location_json</text>
<text x="674" y="542" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ตำแหน่งแบบละเอียด</text>
<text x="386" y="562" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">text</text>
<text x="674" y="562" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">ข้อความจริงของหน่วยนี้</text>
<text x="386" y="580" font-size="11.5" fill="#1f7a4d" font-weight="400" text-anchor="start">ข้อความของเอกสารถูกเก็บที่นี่ที่เดียว</text>
<rect x="768" y="250" width="308" height="130" rx="12" fill="#ffffff" stroke="#f2b705" stroke-width="1.8" filter="url(#soft)"/>
<path d="M768 290 v-28 a12 12 0 0 1 12 -12 h284 a12 12 0 0 1 12 12 v28 z" fill="#f2b705"/>

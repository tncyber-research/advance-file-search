<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760"
     width="100%" role="img" font-family="Sarabun, 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar_accent" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#1d6f8b"/>
    </marker>
    <marker id="ar_muted" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#5a6b7b"/>
    </marker>
    <marker id="ar_green" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#1f7a4d"/>
    </marker>
    <marker id="ar_amber" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#f2b705"/>
    </marker>
    <marker id="ar_coral" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#d9480f"/>
    </marker>
    <marker id="ar_violet" markerWidth="9" markerHeight="9" refX="7.5"
            refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7.5 3 L0 6 z" fill="#5f4b9b"/>
    </marker>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39b3c9"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2733"
                    flood-opacity="0.13"/>
    </filter>

  </defs>
<rect x="0" y="0" width="1100" height="760" fill="none"/>
<rect x="24" y="20" width="268" height="174" rx="12" fill="#ffffff" stroke="#1d6f8b" stroke-width="1.8" filter="url(#soft)"/>
<path d="M24 60 v-28 a12 12 0 0 1 12 -12 h244 a12 12 0 0 1 12 12 v28 z" fill="#1d6f8b"/>
<text x="38" y="47" font-size="14.5" fill="#ffffff" font-weight="700" text-anchor="start">roots — โฟลเดอร์ที่ถูกจัดดัชนี</text>
<text x="38" y="82" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">id</text>
<text x="278" y="82" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">PK</text>
<text x="38" y="102" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">display_path</text>
<text x="278" y="102" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">TEXT</text>
<text x="38" y="122" font-size="12.5" fill="#1b2733" font-weight="400" text-anchor="start">normalized_path</text>
<text x="278" y="122" font-size="11.5" fill="#5a6b7b" font-weight="400" text-anchor="end">UNIQUE</text>

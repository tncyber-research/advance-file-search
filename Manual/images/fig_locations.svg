<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300"
     width="100%" role="img" font-family="Sarabun, 'Leelawadee UI', 'Noto Sans Thai', Tahoma, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39b3c9"/>
      <stop offset="1" stop-color="#1d6f8b"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4f7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b9e77"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1b2733"
                    flood-opacity="0.13"/>
    </filter>

  </defs>
<rect x="0" y="0" width="960" height="300" fill="none"/>
<rect x="24" y="24" width="912" height="56" rx="14" fill="#ffffff" stroke="#d9dfe5" stroke-width="1.5" filter="url(#soft)"/>
<rect x="24" y="24" width="8" height="56" rx="4" fill="#1d6f8b"/>
<text x="56" y="59" font-size="17" fill="#1d6f8b" font-weight="700" text-anchor="start">PDF</text>
<rect x="140" y="37" width="300" height="30" rx="8" fill="#e3eef3" stroke="#d9dfe5"/>
<text x="156" y="58" font-size="15" fill="#1b2733" font-weight="600" text-anchor="start">หน้า 12</text>
<text x="468" y="59" font-size="15" fill="#5a6b7b" font-weight="400" text-anchor="start">ระบุเลขหน้า</text>
<rect x="24" y="92" width="912" height="56" rx="14" fill="#ffffff" stroke="#d9dfe5" stroke-width="1.5" filter="url(#soft)"/>
<rect x="24" y="92" width="8" height="56" rx="4" fill="#5f4b9b"/>
<text x="56" y="127" font-size="17" fill="#5f4b9b" font-weight="700" text-anchor="start">DOCX</text>
<rect x="140" y="105" width="300" height="30" rx="8" fill="#e3eef3" stroke="#d9dfe5"/>
<text x="156" y="126" font-size="15" fill="#1b2733" font-weight="600" text-anchor="start">ย่อหน้า 24</text>
<text x="468" y="127" font-size="15" fill="#5a6b7b" font-weight="400" text-anchor="start">ย่อหน้า หรือ ตาราง/แถว/คอลัมน์</text>
<rect x="24" y="160" width="912" height="56" rx="14" fill="#ffffff" stroke="#d9dfe5" stroke-width="1.5" filter="url(#soft)"/>
<rect x="24" y="160" width="8" height="56" rx="4" fill="#1f7a4d"/>
<text x="56" y="195" font-size="17" fill="#1f7a4d" font-weight="700" text-anchor="start">XLSX</text>
<rect x="140" y="173" width="300" height="30" rx="8" fill="#e3eef3" stroke="#d9dfe5"/>
<text x="156" y="194" font-size="15" fill="#1b2733" font-weight="600" text-anchor="start">ชีต: งบประมาณ, เซลล์: F12</text>
<text x="468" y="195" font-size="15" fill="#5a6b7b" font-weight="400" text-anchor="start">ชื่อชีตและตำแหน่งเซลล์</text>
<rect x="24" y="228" width="912" height="56" rx="14" fill="#ffffff" stroke="#d9dfe5" stroke-width="1.5" filter="url(#soft)"/>
<rect x="24" y="228" width="8" height="56" rx="4" fill="#f2b705"/>
<text x="56" y="263" font-size="17" fill="#f2b705" font-weight="700" text-anchor="start">TXT</text>
<rect x="140" y="241" width="300" height="30" rx="8" fill="#e3eef3" stroke="#d9dfe5"/>
<text x="156" y="262" font-size="15" fill="#1b2733" font-weight="600" text-anchor="start">บรรทัด 135</text>
<text x="468" y="263" font-size="15" fill="#5a6b7b" font-weight="400" text-anchor="start">เลขบรรทัด</text>
</svg>

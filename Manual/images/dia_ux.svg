<text x="694" y="249" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<circle cx="686" cy="358" r="15" fill="#d9480f" stroke="#ffffff" stroke-width="2"/>
<text x="686" y="363" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
<circle cx="758" cy="38" r="14" fill="#d9480f"/>
<text x="758" y="43" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="782" y="36" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">แถบชื่อเรื่องพร้อมไอคอน</text>
<text x="782" y="56" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">บอกว่าโปรแกรมคืออะไร แม้ย่อลงบนแถบงาน</text>
<circle cx="758" cy="96" r="14" fill="#d9480f"/>
<text x="758" y="101" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="782" y="94" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">แถวเลือกโฟลเดอร์และเมนู</text>
<text x="782" y="114" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">งานที่ทำครั้งเดียวถูกดันขึ้นบนสุด</text>
<circle cx="758" cy="154" r="14" fill="#d9480f"/>
<text x="758" y="159" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="782" y="152" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">ช่องค้นหาและปุ่มค้นหา</text>
<text x="782" y="172" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">จุดที่ผู้ใช้มองหาก่อนเสมอ จึงเด่นที่สุด</text>
<circle cx="758" cy="212" r="14" fill="#d9480f"/>
<text x="758" y="217" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<text x="782" y="210" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">ตัวกรองแบบพับเก็บได้</text>
<text x="782" y="230" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">ไม่รบกวนผู้ใช้ทั่วไป แต่มีให้เมื่อต้องการ</text>
<circle cx="758" cy="270" r="14" fill="#d9480f"/>
<text x="758" y="275" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<text x="782" y="268" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">ตารางผลลัพธ์</text>
<text x="782" y="288" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">เรียงจากซ้าย: ชื่อ → ข้อความ → ข้อมูลไฟล์</text>
<circle cx="758" cy="328" r="14" fill="#d9480f"/>
<text x="758" y="333" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<text x="782" y="326" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">ปุ่มเปิดโฟลเดอร์</text>
<text x="782" y="346" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">ไอคอนเล็ก ไม่แย่งความสนใจจากผลลัพธ์</text>
<circle cx="758" cy="386" r="14" fill="#d9480f"/>
<text x="758" y="391" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">7</text>
<text x="782" y="384" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">แผงรายละเอียด</text>
<text x="782" y="404" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">ข้อมูลของไฟล์ที่เลือก ไม่พูดซ้ำกับตาราง</text>
<circle cx="758" cy="444" r="14" fill="#d9480f"/>
<text x="758" y="449" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">8</text>
<text x="782" y="442" font-size="13.5" fill="#1b2733" font-weight="700" text-anchor="start">กล่องข้อความที่ตรงกัน</text>
<text x="782" y="462" font-size="12" fill="#5a6b7b" font-weight="400" text-anchor="start">พื้นหลังต่างจากส่วนอื่น และไฮไลต์คำที่ค้น</text>
<rect x="24" y="510" width="1052" height="150" rx="12" fill="#ffffff" stroke="#1d6f8b" stroke-width="1.6" filter="url(#soft)"/>
<rect x="24" y="510" width="7" height="150" rx="3.5" fill="#1d6f8b"/>
<text x="44" y="536" font-size="15" fill="#1d6f8b" font-weight="700" text-anchor="start">หลักที่ใช้ตัดสินใจเรื่องหน้าตา</text>
<text x="44" y="560" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ลำดับสายตา: คำถามของผู้ใช้ (ค้นอะไร) มาก่อนคำตอบ (เจออะไร) เสมอ</text>
<text x="44" y="580" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ทุกอย่างที่แสดงต้องอธิบายตัวเองได้ — ไอคอนที่ไม่มีข้อความต้องมีคำอธิบายเมื่อชี้ค้าง</text>
<text x="44" y="600" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">ไม่ซ้ำข้อมูล: สิ่งที่ตารางบอกแล้ว แผงรายละเอียดไม่พูดซ้ำ</text>
<text x="44" y="620" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">สีใช้เพื่อสื่อความหมาย ไม่ใช่เพื่อความสวย: ส้ม = ต้องระวัง, เขียว = สำเร็จ</text>
<text x="44" y="640" font-size="13" fill="#5a6b7b" font-weight="400" text-anchor="start">รองรับสองภาษาเต็มรูปแบบ และตัวอักษรใหญ่พอสำหรับการอ่านนาน ๆ</text>
</svg>
